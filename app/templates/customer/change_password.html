{% extends "base.html" %}
{% block title %}Change Password — {{ store.store_name }}{% endblock %}

{% block content %}
<div class="container page-section" style="max-width:420px;">
  <h1 class="section-title text-center">Change Password</h1>

  <div class="card">
    {% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert--success" role="status">{{ success }}</div>{% endif %}
    <form method="post" action="/account/change-password">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input class="form-control" id="current_password" type="password" name="current_password" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input class="form-control" id="new_password" type="password" name="new_password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input class="form-control" id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <p class="field-hint">Minimum 8 characters.</p>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>
    <p class="text-center" style="margin-top:14px;"><a href="/account">← Back to My Account</a></p>
  </div>
</div>
{% endblock %}
