{% extends "base.html" %}
{% block title %}Create Account — {{ store.store_name }}{% endblock %}

{% block content %}
<div class="container page-section" style="max-width:420px;">
  <h1 class="section-title text-center">Create Account</h1>

  <div class="card">
    {% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/register" novalidate>
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input class="form-control" id="name" name="name" value="{{ name or '' }}" required autocomplete="name" autofocus>
      </div>
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input class="form-control" id="mobile" name="mobile" value="{{ mobile or '' }}" required inputmode="tel" autocomplete="tel">
        <p class="field-hint">You'll use this to log in next time.</p>
      </div>
      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input class="form-control" id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="email">
      </div>
      <div class="form-row form-row--2">
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input class="form-control" id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
        </div>
      </div>
      <p class="field-hint">Minimum 8 characters.</p>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Create Account</button>
    </form>
    <p class="text-center text-muted" style="font-size:0.85rem; margin-top:14px;">
      Already have an account? <a href="/login{{ '?next=' + next if next else '' }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
