{% extends "base.html" %}
{% block title %}Log In — {{ store.store_name }}{% endblock %}

{% block content %}
<div class="container page-section" style="max-width:420px;">
  <h1 class="section-title text-center">Log In</h1>

  <div class="card">
    {% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input class="form-control" id="mobile" name="mobile" value="{{ mobile or '' }}" required inputmode="tel" autocomplete="tel" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" id="password" type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <p class="text-center text-muted" style="font-size:0.85rem; margin-top:14px;">
      New here? <a href="/register{{ '?next=' + next if next else '' }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
